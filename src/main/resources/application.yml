server:
  port: 8081

spring:
  application:
    name: patient-triage-service
  datasource:
    url: jdbc:h2:mem:triagedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.medireach.triage: DEBUG
    org.springframework.web: INFO
